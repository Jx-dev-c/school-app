server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Aplicação de página única: qualquer rota desconhecida devolve o index e
    # quem resolve o caminho é o roteador do Angular. Sem isto, recarregar a
    # página em /relatorios daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A API atende no mesmo domínio, atrás de /api — assim o navegador não
    # precisa de CORS e o front não guarda endereço de servidor no bundle.
    location /api/ {
        # Resolver do Docker + variável no proxy_pass: sem isso o nginx resolve
        # o nome uma vez, na subida, e fica preso naquele IP — se a API ainda
        # não tinha subido (ou reiniciar depois), todo pedido vira 502.
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8080;
        # com variável no proxy_pass o nginx não reescreve o caminho sozinho:
        # repassar $request_uri mantém /api/auth/login como veio, em vez de
        # virar /api/api/auth/login
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Os arquivos com hash no nome podem ser cacheados para sempre; o index não.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
