name: CI e deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Testes
        run: npx ng test --watch=false

      # A URL da API vem de uma variável do repositório (Settings > Variables).
      # Sem ela, o build usa /api — que só funciona quando o front está atrás do
      # mesmo nginx da API, como no docker compose.
      - name: Apontar para a API publicada
        if: vars.API_URL != ''
        run: |
          echo "export const environment = { producao: true, apiUrl: '${{ vars.API_URL }}' };" \
            > src/environments/environment.production.ts

      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Pages serve arquivo estático: sem o index como página de erro, abrir
      # /relatorios direto daria 404.
      - name: Fallback de rota
        run: cp dist/school-app/browser/index.html dist/school-app/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/school-app/browser

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
